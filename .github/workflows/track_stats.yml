# Save as: .github/workflows/track-stats.yml  (GitHub only reads workflows from that exact folder)
name: Track Club Stats

on:
  schedule:
    - cron: '0 6 * * *'   # UTC only; 06:00 UTC = 08:00 SAST. Runs can be hours late.
  workflow_dispatch: {}

concurrency:
  group: club-tracker
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          BS_API_TOKEN: ${{ secrets.BS_API_TOKEN }}
          BS_CLUB_TAG: ${{ secrets.BS_CLUB_TAG }}
        run: python club_tracker.py

      - name: Commit and push updated data
        run: |
          git config user.name "club-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add club_members.csv club_daily.csv za_clubs.csv za_players.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update club stats $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

  deploy-pages:
    needs: track
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # without this, checkout uses the trigger commit and deploys stale data

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp club_members.csv club_daily.csv za_clubs.csv za_players.csv _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
