# lives in .github/workflows/
name: Collect Ranked Battles

on:
  schedule:
    - cron: '17 2,8,14,20 * * *'   # every 6 hours (UTC), so 04:17, 10:17, 16:17 and 22:17 in SA. can run late
  workflow_dispatch: {}

# same group as track-stats.yml so they never push at the same time
concurrency:
  group: club-tracker
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect ranked games
        env:
          BS_API_TOKEN: ${{ secrets.BS_API_TOKEN }}
          BS_CLUB_TAG: ${{ secrets.BS_CLUB_TAG }}
          BATTLE_SALT: ${{ secrets.BATTLE_SALT }}
        run: python ranked_collector.py
      - name: Commit and push updated data
        run: |
          git config user.name "club-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ranked_stats.csv ranked_seen.txt ranked_meta.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ranked stats $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && exit 0
              echo "Push failed (attempt $i of 5); retrying in $((i * 20))s"
              sleep $((i * 20))
            done
            echo "Push failed after 5 attempts"
            exit 1
          fi

  deploy-pages:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp club_members.csv club_daily.csv za_clubs.csv za_players.csv _site/
          cp ranked_stats.csv ranked_meta.json _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
